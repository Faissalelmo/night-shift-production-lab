global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Batch jobs and the synthetic check push here. honor_labels keeps the job name
  # each pusher chose (job="daily_extract") instead of job="pushgateway".
  - job_name: pushgateway
    honor_labels: true
    static_configs:
      - targets: ["pushgateway:9091"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
